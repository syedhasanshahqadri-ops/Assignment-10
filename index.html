<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE CODERS</title>
</head>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

.site-header {
    width: 100%;
    padding: 35px 15px;
    background: #fff;
}

.nav-container {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
}



.logo {
    flex-shrink: 0;
    margin-right: 80px;
}

.logo a {
    color: #000;
    text-decoration: none;
    font-size: 32px;
    font-weight: 400;
}




.navbar {
    flex-shrink: 0;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
}

.nav-links li {
    position: relative;
    white-space: nowrap;
}

.nav-links li a {
    color: #111;
    text-decoration: none;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
}

.nav-links li a:hover,
.nav-links li .active {
    color: #20c997;
}



.social-icons {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-left: auto;
    padding-right: 15px;
}

.social-icons a {
    color: #111;
    text-decoration: none;
    font-size: 14px;
}

.social-icons a:hover {
    color: #20c997;
}




.dropdown {
    position: relative;
}

.dropdown-menu {
    position: absolute;
    top: 25px;
    left: -15px;

    width: 200px;
    padding: 8px 0;

    background: #fff;
    border-top: 2px solid #20c997;

    list-style: none;

    box-shadow: 0 4px 15px rgba(0,0,0,.1);

    display: none;
    z-index: 9999;
}

.dropdown:hover > .dropdown-menu {
    display: block;
}

.dropdown-menu li {
    width: 100%;
}

.dropdown-menu li a {
    display: flex;
    justify-content: space-between;

    padding: 13px 20px;

    color: #777;
    font-size: 14px;
    letter-spacing: 0;
}

.dropdown-menu li a:hover {
    background: #fafafa;
    color: #20c997;
}



.sub-dropdown {
    position: relative;
}

.sub-menu {
    position: absolute;
    top: -8px;
    left: 100%;

    width: 180px;
    padding: 8px 0;

    background: #fff;
    border-top: 2px solid #20c997;

    list-style: none;

    box-shadow: 0 4px 15px rgba(0,0,0,.1);

    display: none;
}

.sub-dropdown:hover > .sub-menu {
    display: block;
}
</style>
